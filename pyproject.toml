[project]
name = "pivis-health"
version = "0.1.0"
description = "本地优先、隐私优先的个人健康内核：只读客观库 + 确定性计算 + 三级监测 + 报告装配"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pivis-health = "pivis_health.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pivis_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
